<form class="tfm-form form" [formGroup]="form()">
  <div class="tfm-fieldgroup">
    <div class="tfm-fieldgroup-fields">
      <tfm-input tfmControlValueAccessor
                 [class]="passwordFormModel.password.size"
                 [id]="passwordFormModel.password.name"
                 [type]="passwordFormModel.password.type"
                 [label]="passwordFormModel.password.label | translate"
                 [formControlName]="passwordFormModel.password.name"
                 [placeholder]="passwordFormModel.password.placeholder! | translate"
                 [ariaLabel]="passwordFormModel.password.placeholder"
                 [required]="passwordFormModel.password.required ?? false"
      >
      </tfm-input>

      <tfm-input tfmControlValueAccessor
                 [class]="passwordFormModel.confirmPassword.size"
                 [id]="passwordFormModel.confirmPassword.name"
                 [type]="passwordFormModel.confirmPassword.type"
                 [label]="passwordFormModel.confirmPassword.label | translate"
                 [formControlName]="passwordFormModel.confirmPassword.name"
                 [placeholder]="passwordFormModel.confirmPassword.placeholder! | translate"
                 [ariaLabel]="passwordFormModel.confirmPassword.placeholder"
                 [required]="passwordFormModel.confirmPassword.required ?? false"
      >
      </tfm-input>

      <tfm-input tfmControlValueAccessor
                 [class]="passwordFormModel.newPassword.size"
                 [id]="passwordFormModel.newPassword.name"
                 [type]="passwordFormModel.newPassword.type"
                 [label]="passwordFormModel.newPassword.label | translate"
                 [formControlName]="passwordFormModel.newPassword.name"
                 [placeholder]="passwordFormModel.newPassword.placeholder! | translate"
                 [ariaLabel]="passwordFormModel.newPassword.placeholder"
                 [required]="passwordFormModel.newPassword.required ?? false"
      >
      </tfm-input>
    </div>
  </div>
</form>

<footer class="dialog__footer edit-password">
  <tfm-button
    [label]="'profile.action.cancel' | translate "
    (click)="cancel()"
  ></tfm-button>

  <tfm-button
    [label]="'profile.action.confirm' | translate "
    [isDisabled]="!form().valid"
    (click)="form().valid ?  submit() : invalidSelected()"
  ></tfm-button>

</footer>
