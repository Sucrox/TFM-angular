@if(form()){
  <form class="tfm-form form" [formGroup]="form()">
    <div class="tfm-fieldgroup">
      <div class="tfm-fieldgroup-fields">

        <tfm-input tfmControlValueAccessor
                   [class]="registerFormModel.firstName.size"
                   [id]="registerFormModel.firstName.name"
                   [type]="registerFormModel.firstName.type"
                   [label]="registerFormModel.firstName.label | translate"
                   [formControlName]="registerFormModel.firstName.name"
                   [placeholder]="registerFormModel.firstName.placeholder! | translate"
                   [ariaLabel]="registerFormModel.firstName.placeholder"
                   [required]="registerFormModel.firstName.required ?? false"
        >
        </tfm-input>

        <tfm-input tfmControlValueAccessor
                   [class]="registerFormModel.familyName.size"
                   [id]="registerFormModel.familyName.name"
                   [type]="registerFormModel.familyName.type"
                   [label]="registerFormModel.familyName.label | translate"
                   [formControlName]="registerFormModel.familyName.name"
                   [placeholder]="registerFormModel.familyName.placeholder! | translate"
                   [ariaLabel]="registerFormModel.familyName.placeholder"
                   [required]="registerFormModel.familyName.required ?? false"
        >
        </tfm-input>
        <tfm-input tfmControlValueAccessor
                   [class]="registerFormModel.dni.size"
                   [id]="registerFormModel.dni.name"
                   [type]="registerFormModel.dni.type"
                   [label]="registerFormModel.dni.label | translate"
                   [formControlName]="registerFormModel.dni.name"
                   [placeholder]="registerFormModel.dni.placeholder! | translate"
                   [ariaLabel]="registerFormModel.dni.placeholder"
                   [required]="registerFormModel.dni.required ?? false"
        >
        </tfm-input>
        <tfm-input-phone tfmControlValueAccessor
                   [class]="registerFormModel.firstName.size"
                   [id]="registerFormModel.phone.name"
                   [label]="registerFormModel.phone.label | translate"
                   [formControlName]="registerFormModel.phone.name"
                   [placeholder]="registerFormModel.phone.placeholder! | translate"
                   [ariaLabel]="registerFormModel.phone.placeholder"
                   [required]="registerFormModel.phone.required ?? false"
        >
        </tfm-input-phone>

        <tfm-input-email tfmControlValueAccessor
                   [class]="registerFormModel.email.size"
                   [id]="registerFormModel.email.name"
                   [type]="registerFormModel.email.type"
                   [label]="registerFormModel.email.label | translate"
                   [formControlName]="registerFormModel.email.name"
                   [placeholder]="registerFormModel.email.placeholder! | translate"
                   [ariaLabel]="registerFormModel.email.placeholder"
                   [required]="registerFormModel.email.required ?? false"
        >
        </tfm-input-email>

        <tfm-input tfmControlValueAccessor
                   [class]="registerFormModel.password.size"
                   [id]="registerFormModel.password.name"
                   [type]="registerFormModel.password.type"
                   [label]="registerFormModel.password.label | translate"
                   [formControlName]="registerFormModel.password.name"
                   [placeholder]="registerFormModel.password.placeholder! | translate"
                   [ariaLabel]="registerFormModel.password.placeholder"
                   [required]="registerFormModel.password.required ?? false"
        >
        </tfm-input>

        <tfm-input tfmControlValueAccessor
                   [class]="registerFormModel.confirmPassword.size"
                   [id]="registerFormModel.confirmPassword.name"
                   [type]="registerFormModel.confirmPassword.type"
                   [label]="registerFormModel.confirmPassword.label | translate"
                   [formControlName]="registerFormModel.confirmPassword.name"
                   [placeholder]="registerFormModel.confirmPassword.placeholder! | translate"
                   [ariaLabel]="registerFormModel.confirmPassword.placeholder"
                   [required]="registerFormModel.confirmPassword.required ?? false"
        >
        </tfm-input>
      </div>
    </div>

    @defer (when showWarning()){
      <tfm-ribbon
        [text]="passwordsDoNotMatch()
          ? ('register.registerForm.passwordMismatch' | translate)
          : ('register.registerForm.error' | translate)"
        [state]="ribbonTypeEnum.ERROR"
        dismissable
      ></tfm-ribbon>
    }
    <div class="center">
      <tfm-button
        [label]="'register.action' | translate "
        [isDisabled]="!form().valid"
        (click)="form().valid ?  submitForm() : invalidSelected()"
      ></tfm-button>
    </div>
  </form>
}
