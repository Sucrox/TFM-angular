<div class="main-wrapper">
  <div class="table-wrapper">
    <h2 class="title">{{ 'shoppingCart.title' | translate }}</h2>
    <hr/>
    <shopping-table
      [rows]="products()"
      [totalItems]="totalItems()"
      [itemsPerPage]="itemsPerPage()"
      (productDeleted)="onProductDeleted($event)"
      (productIncrement)="onProductIncrement($event)"
      (productDecrement)="onProductDecrement($event)"
    ></shopping-table>
  </div>
  <div class="side-wrapper">
    <div class="resume">
      <div style="display: flex; justify-content: space-between; align-items: center" >
        <h3>{{'shoppingCart.total' | translate}}</h3>
        <span class="tfm-paragraph-bold">{{ total() | currency:'EUR':'symbol':'1.2-2' }}</span>
      </div>
      @if(products()){
      <div style="display: flex; justify-content: center;" >
      <tfm-button
        [label]="'shoppingCart.confirm' | translate"
        [variant]="ButtonTypeEnum.SECONDARY"
        (click)="confirmCart()"
      ></tfm-button>
      </div>
      }
    </div>
  </div>
</div>
