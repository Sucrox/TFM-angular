<header>
  <nav class="header" id="header">
    <div class="links">
      <div>
        <img style="height: 100px; width: 100px;object-fit: contain" src="assets/shared/logo.png" alt="Home">
      </div>

      @if(routes().length>0){
        <div class="row">
          @for(route of routes(); track route.route){
            <a class="link__router ui-label-small"
               role="menuitem"
               [class.links__route--active]="isActiveRoute(route.route)"
               (click)="goTo(route.route)"
               [attr.aria-label]="route.text"
               tabindex="0"
            >
              {{route.text}}
            </a>
          }
        </div>
      }

      <div class="row">

        <tfm-prefix-selector tfmControlValueAccessor
                             header
                             [ariaLabel]="'header.languageSelecto' | translate"
                             [theme]="userWidgetTheme"
                             [formControl]="languageWidget"
                             [prefixType]="langWidgetType"
                             [options]="supportedLangs"

        >

        </tfm-prefix-selector>

        @if (user()) {
          <tfm-user-widget
            [name]="fullName()"
            [theme]="Theme.DARK"
            [avatarType]="UserTypeEnum.INITIALS"
            [avatarContent]="initials()"
            (click)="goTo(DomainRoutesEnum.PROFILE)"
          >
          </tfm-user-widget>
        }

        @if (isLogin()){
          <a (click)="logout.emit()">
            <img src="assets/shared/logout.png" alt="logout">
            <span class="white"> Logout</span>
          </a>
        }
      </div>
    </div>
  </nav>
</header>
